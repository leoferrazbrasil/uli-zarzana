name: Deploy CRM static

on:
  push:
    branches:
      - main
    paths:
      - "web/crm/**"
      - ".github/workflows/deploy-crm-static.yml"
  workflow_dispatch:

concurrency:
  group: deploy-crm-static
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish web/crm to crm.ulizarzana.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync CRM files over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CRM_FTP_SERVER }}
          username: ${{ secrets.CRM_FTP_USERNAME }}
          password: ${{ secrets.CRM_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./web/crm/
          server-dir: ./crm/
          state-name: .github/ftp-state-crm.json
